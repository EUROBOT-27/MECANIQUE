# Map Anchor Marker Configuration
# This file defines the world coordinates of the 4 fixed ArUco markers
# placed at the corners of the playing field.
#
# PHYSICAL MARKER MAPPING (VERIFIED BY SCANNING):
# +---------------------------------------------+
# |  ID 20 (Top-left)      ID 21 (Top-right)   |
# |  @ (0.6, 1.4)          @ (2.4, 1.4)         |
# |                                              |
# |              3.0m x 2.0m FIELD              |
# |                                              |
# |  ID 22 (Bottom-left)   ID 23 (Bottom-right) |
# |  @ (0.6, 0.6)          @ (2.4, 0.6)         |
# +---------------------------------------------+

# World coordinate system definition
coordinate_system:
  origin: "Marker ID 0 center"
  handedness: "right-handed"
  units: "meters"
  axes:
    x: "Along table width (Marker 0 → Marker 1)"
    y: "Along table length (Marker 0 → Marker 3)"
    z: "Perpendicular to table (upward)"

# Playing field dimensions (Eurobot 2026 standard)
field:
  width: 3.000   # X-axis dimension [m]
  length: 2.000  # Y-axis dimension [m]
  border_height: 0.022  # Border height [m]

# ArUco marker configuration
aruco:
  dictionary: "DICT_4X4_50"  # OpenCV ArUco dictionary (must match generated markers!)
  marker_size: 0.100  # Physical marker size in meters (10 cm)
  
  # Marker ID assignments (Eurobot 2026 rules)
  # IDs 1-5: Blue team robots
  # IDs 6-10: Yellow team robots  
  # IDs 11-50: Game field and elements
  marker_ids:
    map_anchors: [20, 21, 22, 23]  # Fixed corner markers for localization
    caisses:
      blue: 36
      yellow: 47
      black: 41  # Caisse pourrie (rotten box)
    blue_robots: [1, 2, 3, 4, 5]
    yellow_robots: [6, 7, 8, 9, 10]

# Map anchor marker positions
# Each marker has:
#   - center: 3D position of marker center [x, y, z] in meters
#   - corners: 4 corner positions in ArUco order (top-left, top-right, bottom-right, bottom-left when viewed from above)
#   - size: marker outer dimension in meters
markers:
  22:
    description: "Bottom-left (inset 0.6m from edges)"
    center: [0.600, 0.600, 0.000]
    corners:
      # Corners in ArUco standard order (10cm marker)
      - [0.550, 0.550, 0.000]  # Top-left
      - [0.650, 0.550, 0.000]  # Top-right
      - [0.650, 0.650, 0.000]  # Bottom-right
      - [0.550, 0.650, 0.000]  # Bottom-left
    size: 0.100
    
  23:
    description: "Bottom-right (inset 0.6m from edges)"
    center: [2.400, 0.600, 0.000]
    corners:
      - [2.350, 0.550, 0.000]  # Top-left
      - [2.450, 0.550, 0.000]  # Top-right
      - [2.450, 0.650, 0.000]  # Bottom-right
      - [2.350, 0.650, 0.000]  # Bottom-left
    size: 0.100
    
  21:
    description: "Top-right (inset 0.6m from edges)"
    center: [2.400, 1.400, 0.000]
    corners:
      - [2.350, 1.350, 0.000]  # Top-left
      - [2.450, 1.350, 0.000]  # Top-right
      - [2.450, 1.450, 0.000]  # Bottom-right
      - [2.350, 1.450, 0.000]  # Bottom-left
    size: 0.100
    
  20:
    description: "Top-left (inset 0.6m from edges)"
    center: [0.600, 1.400, 0.000]
    corners:
      - [0.550, 1.350, 0.000]  # Top-left
      - [0.650, 1.350, 0.000]  # Top-right
      - [0.650, 1.450, 0.000]  # Bottom-right
      - [0.550, 1.450, 0.000]  # Bottom-left
    size: 0.100

# Calibration settings
calibration:
  # Minimum number of markers required for extrinsics computation
  min_markers_required: 4
  
  # PnP algorithm to use
  pnp_method: "SOLVEPNP_ITERATIVE"  # Options: SOLVEPNP_ITERATIVE, SOLVEPNP_SQPNP, SOLVEPNP_IPPE
  
  # Use RANSAC for robustness
  use_ransac: true
  ransac_reprojection_error: 3.0  # pixels
  
  # Validation thresholds
  validation:
    max_reprojection_error: 1.0  # pixels (mean)
    max_position_std: 0.001  # meters (1mm)
    max_orientation_std: 0.1  # degrees
    min_detection_rate: 95.0  # percentage

# Visualization settings
visualization:
  show_marker_ids: true
  show_axes: true
  axes_length: 0.2  # meters
  show_corners: true
  
# Output paths (relative to project root)
output:
  extrinsics_dir: "calibration/"
  validation_dir: "calibration/validation/"
  logs_dir: "logs/"
